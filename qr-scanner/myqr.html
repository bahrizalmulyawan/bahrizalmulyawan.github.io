<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QR CODE SCANNER</title>
  <link rel="icon" type="images/logo.png" href="logo.png">
</head>
<script src="html5-qrcode.min.js"></script>

<style>


<script src="html5-qrcode.min.js"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:system-ui;
background:linear-gradient(160deg,#f1f5f9,#e2e8f0);
color:#0f172a;
}

.container{
width:92%;
max-width:420px;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
border-radius:18px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.title{
text-align:center;
font-size:20px;
margin-bottom:15px;
font-weight:600;
}

.scanner{
position:relative;
width:100%;
aspect-ratio:1;
border-radius:14px;
overflow:hidden;
background:black;
}

#reader{
width:100%;
height:100%;
}

.qr-highlight{
position:absolute;
border:3px solid #22c55e;
border-radius:10px;
box-shadow:0 0 10px #22c55e,0 0 20px #22c55e;
display:none;
pointer-events:none;
}

.viewfinder{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:72%;
height:72%;
pointer-events:none;
}

.corner{
position:absolute;
width:28px;
height:28px;
border:4px solid #22c55e;
}

.tl{top:0;left:0;border-right:none;border-bottom:none}
.tr{top:0;right:0;border-left:none;border-bottom:none}
.bl{bottom:0;left:0;border-right:none;border-top:none}
.br{bottom:0;right:0;border-left:none;border-top:none}

.laser{
position:absolute;
width:100%;
height:3px;
background:linear-gradient(90deg,transparent,#22c55e,#22c55e,transparent);
box-shadow:0 0 8px #22c55e;
animation:laser 2s infinite ease-in-out;
}

@keyframes laser{
0%{top:0}
50%{top:100%}
100%{top:0}
}

.controls{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:15px;
justify-content:center;
}

button,select{
border:none;
background:#f1f5f9;
color:#0f172a;
padding:9px 12px;
border-radius:8px;
font-size:13px;
cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

button:hover{
background:#e2e8f0;
}

.status{
text-align:center;
margin-top:10px;
font-size:13px;
color:#475569;
}

</style>

</head>

<body>

<div class="container">

                    <center><img src="images/logo-large.png" alt="Scanner" width="250">  </center>

<div class="title">
Scan QR Login
</div>

<div class="scanner">

<div id="reader"></div>

<div id="qr-highlight" class="qr-highlight"></div>

<div class="viewfinder">
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div class="laser"></div>
</div>

</div>

<div class="controls">

<button onclick="reloadCamera()">Reload</button>

<select id="cameraSelect"></select>

<button onclick="openChrome()">Open Chrome</button>

</div>

<div class="status" id="status">
Arahkan QR ke dalam kotak
</div>

</div>

<script>

let html5QrCode=new Html5Qrcode("reader");
let currentCameraId=null;

/* DOMAIN ALLOWLIST */

const ALLOWED_DOMAINS=[
"putracandi.net",
"putracandi.com",
"putracandinet.com",


"essteh.net",
"essteh.com",

"esteh.net",
"esteh.com",

"estehraja.com",
"estehraja.net"
];

/* VALIDASI DOMAIN */

function isAllowedDomain(url){

try{

let host=new URL(url).hostname.toLowerCase();

return ALLOWED_DOMAINS.some(domain =>
host===domain || host.endsWith("." + domain)
);

}catch{

return false;

}

}

/* SCAN SUCCESS */

function onScanSuccess(decodedText,decodedResult){

let highlight=document.getElementById("qr-highlight");

if(decodedResult.result?.cornerPoints){

let p=decodedResult.result.cornerPoints;

let minX=Math.min(...p.map(pt=>pt.x));
let minY=Math.min(...p.map(pt=>pt.y));
let maxX=Math.max(...p.map(pt=>pt.x));
let maxY=Math.max(...p.map(pt=>pt.y));

highlight.style.left=minX+"px";
highlight.style.top=minY+"px";
highlight.style.width=(maxX-minX)+"px";
highlight.style.height=(maxY-minY)+"px";

highlight.style.display="block";

}

if(!isAllowedDomain(decodedText)){

document.getElementById("status").innerText="QR CODE INVALID";

return;

}

document.getElementById("status").innerText="Redirecting...";

html5QrCode.stop().then(()=>{
window.location.href=decodedText;
});

}

/* START CAMERA */

function startCamera(id){

currentCameraId=id;

html5QrCode.start(

id,

{
fps:30,
qrbox:{width:220,height:220},
aspectRatio:1,
disableFlip:false
},

onScanSuccess

);

}

/* DEFAULT BACK CAMERA */

function startBackCamera(){

startCamera({facingMode:"environment"});

}

/* LIST CAMERA */

Html5Qrcode.getCameras().then(devices=>{

let select=document.getElementById("cameraSelect");

devices.forEach(cam=>{

let opt=document.createElement("option");

opt.value=cam.id;
opt.text=cam.label||"Camera";

select.appendChild(opt);

});

startBackCamera();

select.onchange=function(){

html5QrCode.stop().then(()=>{
startCamera(this.value);
});

};

});

/* RELOAD */

function reloadCamera(){

html5QrCode.stop().then(()=>{
startBackCamera();
});

}

/* OPEN CHROME */

function openChrome(){

let intent="intent://"+location.host+location.pathname+
"#Intent;scheme=https;package=com.android.chrome;end";

window.location.href=intent;

}

</script>

</body>
</html>
