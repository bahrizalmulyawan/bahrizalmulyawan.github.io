<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSTV Decoder</title>
<style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:32px auto;padding:0 16px;background:#f6f6f6;color:#222}main{background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}h1{margin-top:0}label{display:block;margin:12px 0 6px;font-weight:600}input,select,button{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px}button{cursor:pointer}#status{margin:16px 0;white-space:pre-wrap}canvas{max-width:100%;height:auto;image-rendering:auto;border:1px solid #ccc} .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}</style></head>
<body><main><h1>📡 SSTV Decoder</h1><p>Decoder untuk audio SSTV yang dibuat oleh <b>SSTV Encoder</b>. Pilih WAV lalu Decode.</p>
<div class="row"><div><label>Audio WAV</label><input id="audio" type="file" accept="audio/wav,.wav"></div><div><label>Mode</label><select id="mode"><option value="auto">Auto (VIS)</option></select></div><button id="decode">Decode</button><button id="save" disabled>Simpan PNG</button></div>
<div id="status">Belum ada audio.</div><canvas id="out"></canvas></main>
<script src="decoder.js"></script><script>
const mode=document.getElementById('mode'); for(const [k,v] of Object.entries(SSTVDecoder.MODES)){const o=document.createElement('option');o.value=k;o.textContent=v.name;mode.appendChild(o)}
let result=null;
document.getElementById('decode').onclick=async()=>{const file=document.getElementById('audio').files[0];if(!file){alert('Pilih file WAV dulu.');return}const st=document.getElementById('status');st.textContent='Menganalisis audio…';try{const ac=new AudioContext();const buf=await ac.decodeAudioData(await file.arrayBuffer());result=SSTVDecoder.decodeSSTV(buf,{mode:mode.value});const out=document.getElementById('out');out.width=result.canvas.width;out.height=result.canvas.height;out.getContext('2d').drawImage(result.canvas,0,0);st.textContent=`Mode: ${result.mode.name}\nVIS: ${result.vis.code} (parity ${result.vis.parityOk?'OK':'warning'})`;document.getElementById('save').disabled=false;await ac.close()}catch(e){console.error(e);st.textContent='Gagal decode: '+e.message}};
document.getElementById('save').onclick=()=>{if(!result)return;const a=document.createElement('a');a.href=result.canvas.toDataURL('image/png');a.download='sstv-decoded.png';a.click()};
</script></body></html>
