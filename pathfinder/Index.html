<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Patchfinder — visualisasi algoritma pathfinding pada maze/grid."
  >
  <title>Patchfinder — Pathfinding Visualizer</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #60a5fa;
      --border: #475569;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(100%, 560px);
    }

    .card {
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 16px 40px rgb(0 0 0 / 20%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.1;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #273449;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .link:hover,
    .link:focus-visible {
      background: var(--card-hover);
      transform: translateY(-1px);
    }

    .link:focus-visible {
      outline: 3px solid rgb(96 165 250 / 45%);
      outline-offset: 2px;
    }

    .link small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-weight: 400;
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Patchfinder</h1>
      <p class="subtitle">
        Visualisasi algoritma pathfinding untuk memahami proses pencarian rute
        pada maze/grid.
      </p>

      <nav class="links" aria-label="Navigasi Patchfinder">
        <a class="link" href="Patchfinderv2/Patchfinderv2.html">
          Patchfinder v2
          <small>Versi utama dengan fitur multi-start, multi-goal, dan visualisasi pencarian.</small>
        </a>



        <a class="link" href="Patchfinderv1/Patchfinderv1.html">
          Patchfinder v1
          <small>Versi terdahulu untuk referensi dan perbandingan.</small>
        </a>
      </nav>

      <footer>
        Patchfinder — Maze Pathfinding Visualizer
      </footer>
    </section>
  </main>
</body>
</html>
